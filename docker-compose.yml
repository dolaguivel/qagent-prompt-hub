# Company server: the hub plus its own PostgreSQL database.
#   1. Copy .env.example to .env and set DB_PASSWORD (and ADMIN_PASSWORD).
#   2. docker compose up -d --build
#   3. Open http://<server>:3000 (put it behind your HTTPS reverse proxy).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 5s
      timeout: 5s
      retries: 20

  hub:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://hub:${DB_PASSWORD}@db:5432/hub
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-qualifacts.com}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-123456}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-654321}
      REQUIRE_PASSWORD_CHANGE: ${REQUIRE_PASSWORD_CHANGE:-false}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-America/Chicago}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}

volumes:
  pgdata:
