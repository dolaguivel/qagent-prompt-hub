<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QAgent Prompt Hub | Qualifacts</title>
  <meta name="description" content="Ready-to-use QAgent prompts for reviewing, diagnosing, fixing and testing work items in Credible, CareLogic and InSync.">
  <link rel="icon" type="image/png" href="assets/img/qualifacts-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/boot.js"></script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <!-- Sign in, create account, forced password change -->
  <div class="auth" id="auth" hidden></div>

  <!-- Loading state while the session is checked -->
  <div class="splash" id="splash"><img src="assets/img/qualifacts-mark.png" alt="" width="56" height="56"></div>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <a href="#/" class="brand-link" aria-label="QAgent Prompt Hub home">
          <img class="brand-logo" src="assets/img/qualifacts-logo.png" alt="Qualifacts" width="626" height="132">
        </a>
        <p class="brand-product">QAgent Prompt Hub</p>
      </div>

      <nav class="nav" id="mainNav"></nav>

      <div class="side-section">
        <p class="side-heading">Categories</p>
        <ul class="cat-nav" id="catNav"></ul>
      </div>

      <div class="side-foot">
        <a href="#/settings" class="nav-link" data-route="settings"><svg class="i" aria-hidden="true"><use href="#i-sliders"/></svg><span>Settings</span></a>
        <a href="#/about" class="nav-link" data-route="about"><svg class="i" aria-hidden="true"><use href="#i-info"/></svg><span>Add a prompt</span></a>
        <p class="side-version" id="sideVersion"></p>
      </div>
    </aside>
    <div class="nav-backdrop" data-act="nav-close" aria-hidden="true"></div>

    <div class="main">
      <div class="banner" id="banner" hidden></div>
      <header class="topbar">
        <button class="icon-btn only-mobile" data-act="nav-open" aria-label="Open navigation"><svg class="i"><use href="#i-menu"/></svg></button>

        <label class="search" for="globalSearch">
          <svg class="i" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="globalSearch" type="search" placeholder="Search prompts, tags, stages" autocomplete="off" spellcheck="false">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
        </label>

        <div class="topbar-right">
          <span class="demo-pill" id="demoPill" hidden title="This server runs with generated demo data">Demo data</span>
          <div id="ticketChip"></div>
          <button class="icon-btn" data-act="theme" aria-label="Switch between light and dark theme" title="Switch theme">
            <svg class="i theme-light"><use href="#i-moon"/></svg>
            <svg class="i theme-dark"><use href="#i-sun"/></svg>
          </button>
          <div class="user-menu">
            <button class="avatar-btn" id="userBtn" data-act="user-menu" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu"></button>
            <div class="menu" id="userMenu" role="menu" hidden></div>
          </div>
        </div>
      </header>

      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-act="modal-close"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalCard"></div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></symbol>

      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4.5M12 8h.01"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></symbol>

      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.6 6.6 0 0 0 9.7 9.7z"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>

      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 21h14"/></symbol>

      <symbol id="i-duplicate" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/><path d="M14.5 12v6M11.5 15h6"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15"/></symbol>

      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></symbol>
      <symbol id="i-rows" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6.5" rx="1.5"/><rect x="3" y="13.5" width="18" height="6.5" rx="1.5"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M10 14 20 4M18 13.5V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 19V7.5A1.5 1.5 0 0 1 5.5 6H11"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8.1 7.5 9.5 4.4-1.4 7.5-4.9 7.5-9.5V6Z"/><path d="m9 12 2.2 2.2L15.5 10"/></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path d="m8.5 7-5 5 5 5M15.5 7l5 5-5 5M13.5 4.5l-3 15"/></symbol>

      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4.5"/><path d="m11.2 11.8 9.3-9.3M17 6l3 3M14.5 8.5l2 2"/></symbol>

  </svg>

  <script src="data/prompts.js"></script>
  <script src="assets/js/charts.js"></script>
  <script src="assets/js/admin.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
